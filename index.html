<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPA Print Prep</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ef; --surface: #ffffff; --surface2: #f0ede8; --border: #e2ddd6;
    --text: #1a1814; --text2: #6b6560; --text3: #9e9890;
    --accent: #2d5a3d; --accent2: #4a7c5f; --accent-bg: #eaf2ec;
    --warn: #92400e; --warn-bg: #fef3c7;
    --front: #1e3a5f; --front-bg: #dbeafe;
    --back: #4c1d95; --back-bg: #ede9fe;
    --other: #065f46; --other-bg: #d1fae5;
    --danger: #991b1b; --danger-bg: #fee2e2;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
    --radius: 10px; --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--accent); color: white; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header-title { display: flex; align-items: center; gap: 14px; }
  .header-logo { width: 38px; height: 38px; background: rgba(255,255,255,0.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; letter-spacing: -1px; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header p { font-size: 12px; opacity: 0.65; margin-top: 1px; }
  .sheet-status { font-size: 12px; font-family: var(--mono); background: rgba(255,255,255,0.12); padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  main { max-width: 980px; margin: 0 auto; padding: 28px 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; }
  .selectors { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr 1fr; gap: 12px; align-items: end; }
  @media(max-width: 720px) { .selectors { grid-template-columns: 1fr 1fr; } .sel-add { grid-column: 1/-1; } }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .field select, .field input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: 14px; font-family: var(--sans); appearance: none; -webkit-appearance: none; outline: none; transition: border-color 0.15s; }
  .field select:focus, .field input:focus { border-color: var(--accent2); background: white; }
  .field select:disabled { opacity: 0.45; cursor: not-allowed; }
  .sel-wrap { position: relative; }
  .sel-wrap::after { content: '▾'; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text3); pointer-events: none; }
  .btn { padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; font-family: var(--sans); cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; }
  .btn-danger:hover { background: #fca5a5; }
  #error-bar { display: none; background: var(--danger-bg); color: var(--danger); border: 1px solid #fca5a5; border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-top: 12px; }
  #loading-bar { display: none; text-align: center; padding: 40px; color: var(--text2); font-size: 14px; }
  .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Batch list */
  #batch-section { display: none; }
  .batch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .batch-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface2); border-radius: var(--radius); margin-bottom: 8px; }
  .batch-item:last-child { margin-bottom: 0; }
  .batch-num { font-size: 22px; font-weight: 600; color: var(--accent); min-width: 42px; text-align: center; font-family: var(--mono); }
  .batch-detail { flex: 1; }
  .batch-label { font-size: 14px; font-weight: 500; }
  .batch-sub { font-size: 12px; color: var(--text2); margin-top: 2px; font-family: var(--mono); }
  .batch-actions { display: flex; gap: 6px; }

  /* Preview panel */
  #preview-section { display: none; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface2); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 5px; font-weight: 500; letter-spacing: 0.3px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media(max-width: 640px) { .two-col { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.4px; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-right: 4px; }
  .badge-front { background: var(--front-bg); color: var(--front); }
  .badge-back { background: var(--back-bg); color: var(--back); }
  .badge-other { background: var(--other-bg); color: var(--other); }
  .warn-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 20px; }
  .placement-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .placement-row:last-child { border-bottom: none; }
  .logo-letter { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex-shrink: 0; font-family: var(--mono); }
  .placement-detail { flex: 1; }
  .placement-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .placement-pos { font-size: 12px; color: var(--text2); font-family: var(--mono); }
  .press-info { font-size: 11px; color: var(--text3); margin-top: 4px; }
  svg.garment { display: block; margin: 0 auto; }

  /* File list */
  .file-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .file-table th { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text3); padding: 0 8px 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .file-table td { padding: 9px 8px; border-bottom: 1px solid var(--surface2); vertical-align: middle; }
  .file-table tr:last-child td { border-bottom: none; }
  .file-table td:first-child { font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .qty-pill { display: inline-block; background: var(--accent); color: white; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; font-family: var(--mono); min-width: 36px; text-align: center; }
  .copy-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .notice { background: var(--warn-bg); border: 1px solid #fcd34d; border-radius: var(--radius); padding: 10px 14px; font-size: 12px; color: var(--warn); display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
  .notice-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  /* PDF action bar */
  .pdf-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }

  footer { text-align: center; padding: 24px; font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .refresh-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 5px; padding: 0; }
  .refresh-btn:hover { color: white; }

  /* Divider between preview jobs */
  .preview-job { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px dashed var(--border); }
  .preview-job:last-child { border-bottom: none; }
  .preview-job-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .job-index { background: var(--accent); color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="header-title">
    <div class="header-logo">UP</div>
    <div>
      <h1>UPA Print Prep</h1>
      <p>Uniform print job preparation</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="sheet-status" id="sheet-status"><span class="dot-live"></span> loading sheet...</div>
    <button class="refresh-btn" onclick="reloadSheet()">&#8635; Refresh</button>
  </div>
</header>

<main>
  <div id="loading-bar"><span class="spinner"></span> Fetching your Google Sheet...</div>

  <div id="app" style="display:none">

    <!-- Job setup -->
    <div class="card">
      <div class="card-title">Add garment to batch</div>
      <div class="selectors">
        <div class="field">
          <label>Adult / Child</label>
          <div class="sel-wrap">
            <select id="sel-ac" onchange="onACChange()"><option value="">Select...</option></select>
          </div>
        </div>
        <div class="field">
          <label>Garment</label>
          <div class="sel-wrap">
            <select id="sel-item" disabled onchange="onItemChange()"><option value="">Select adult/child first</option></select>
          </div>
        </div>
        <div class="field">
          <label>Size</label>
          <div class="sel-wrap">
            <select id="sel-size" disabled><option value="">Select garment first</option></select>
          </div>
        </div>
        <div class="field">
          <label>Quantity</label>
          <input type="number" id="qty" value="1" min="1" max="999">
        </div>
        <div class="field sel-add">
          <label>&nbsp;</label>
          <button class="btn btn-primary" onclick="addToBatch()" style="width:100%">+ Add to batch</button>
        </div>
      </div>
      <div id="error-bar"></div>
    </div>

    <!-- Batch list -->
    <div id="batch-section" class="card">
      <div class="batch-header">
        <div class="card-title" style="margin:0">Current batch</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="clearBatch()" style="padding:6px 12px;font-size:12px">✕ Clear all</button>
          <button class="btn btn-primary" onclick="previewBatch()" style="padding:6px 16px;font-size:13px">▶ Preview &amp; export</button>
        </div>
      </div>
      <div id="batch-list"></div>
    </div>

    <!-- Preview & export -->
    <div id="preview-section">

      <div class="pdf-bar">
        <div style="font-size:15px;font-weight:600;flex:1">Batch preview</div>
        <button class="btn btn-secondary" onclick="copyAllFiles()" style="padding:8px 16px;font-size:13px">&#128203; Copy all filenames</button>
        <button class="btn btn-primary" onclick="downloadPDF()" style="padding:8px 18px;font-size:13px">&#8681; Download PDF</button>
      </div>

      <!-- Batch summary table -->
      <div class="card" id="summary-card">
        <div class="card-title">Batch summary — all garments</div>
        <div id="summary-table"></div>
      </div>

      <!-- Per-job previews -->
      <div id="job-previews"></div>

    </div>

  </div>
</main>

<footer>UPA Print Prep &mdash; data loaded live from Google Sheets</footer>

<script>
const SHEET_ID = '1e2bRbJwGPwEbXX8XXzQwYSFZVenGF8_1OoluX4ayBVA';
const GID = '1102647217';
let allRows = [];
let batch = []; // [{ac, item, size, qty, rows}]

// ── Sheet loading ─────────────────────────────────────────────────────────────
function csvToRows(text) {
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h,i) => obj[h.trim()] = (vals[i]||'').trim());
    return obj;
  }).filter(r => r['Adult - Child'] && r['Item']);
}

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i]==='"') { inQ=!inQ; }
    else if (line[i]===','&&!inQ) { result.push(cur); cur=''; }
    else cur+=line[i];
  }
  result.push(cur); return result;
}

async function loadSheet() {
  document.getElementById('loading-bar').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.getElementById('sheet-status').innerHTML = '<span class="dot-live"></span> loading...';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('Sheet returned '+r.status);
    const text = await r.text();
    allRows = csvToRows(text);
    document.getElementById('loading-bar').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sheet-status').innerHTML = `<span class="dot-live"></span> ${allRows.length} rows loaded`;
    initSelectors();
  } catch(e) {
    document.getElementById('loading-bar').innerHTML = `
      <div style="color:#991b1b;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px 24px;max-width:480px;margin:0 auto;text-align:left">
        <strong style="display:block;margin-bottom:8px">Could not load Google Sheet</strong>
        <p style="font-size:13px;margin-bottom:12px">Make sure the sheet is shared as "Anyone with the link — Viewer".</p>
        <button class="btn btn-primary" onclick="reloadSheet()" style="width:auto">Try again</button>
      </div>`;
    document.getElementById('sheet-status').innerHTML = '<span style="color:#fca5a5">&#9679;</span> error';
  }
}

function reloadSheet() { loadSheet(); }

// ── Selectors ─────────────────────────────────────────────────────────────────
function initSelectors() {
  const acVals = [...new Set(allRows.map(r => r['Adult - Child']))].filter(Boolean).sort();
  const sel = document.getElementById('sel-ac');
  sel.innerHTML = '<option value="">Select...</option>';
  acVals.forEach(v => sel.appendChild(new Option(v,v)));
}

function onACChange() {
  const ac = document.getElementById('sel-ac').value;
  const selItem = document.getElementById('sel-item');
  selItem.innerHTML = '<option value="">Select garment...</option>';
  selItem.disabled = !ac;
  document.getElementById('sel-size').innerHTML = '<option value="">Select garment first</option>';
  document.getElementById('sel-size').disabled = true;
  if (!ac) return;
  [...new Set(allRows.filter(r=>r['Adult - Child']===ac).map(r=>r['Item']))]
    .forEach(v => selItem.appendChild(new Option(v,v)));
}

function onItemChange() {
  const ac = document.getElementById('sel-ac').value;
  const item = document.getElementById('sel-item').value;
  const selSize = document.getElementById('sel-size');
  selSize.innerHTML = '<option value="">Select size...</option>';
  selSize.disabled = !item;
  if (!item) return;
  [...new Set(allRows.filter(r=>r['Adult - Child']===ac&&r['Item']===item).map(r=>r['Size']))]
    .forEach(v => selSize.appendChild(new Option(v,v)));
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function hasWarning(row) { return ['Logo','Position1','Postion2','Position3'].some(k=>(row[k]||'').includes('?')); }
function cleanLogo(raw) { return raw.replace(/^\?+/,'').trim(); }
function logoLetter(logo) { const m=logo.match(/^([A-Z])/); return m?m[1]:'?'; }
function safeFile(s) { return s.replace(/[<>:"/\\|?*]/g,'_').trim(); }
function locationBadge(loc) {
  const l=loc.toLowerCase();
  if(l.includes('front')) return `<span class="badge badge-front">Front</span>`;
  if(l.includes('back')) return `<span class="badge badge-back">Back</span>`;
  return `<span class="badge badge-other">${loc}</span>`;
}

// Build the file list for a job — ONE file per placement (not per qty)
function buildFileList(jobRows) {
  return jobRows.map(row => {
    const logo = cleanLogo(row['Logo']||'');
    const loc  = safeFile(row['Location']||'location');
    return {
      name: `${safeFile(logo)}_${loc}.png`,
      logo,
      loc: row['Location']||'',
      letter: logoLetter(logo),
      pos1: row['Position1']||'',
      pos2: row['Postion2']||'',
      pos3: row['Position3']||'',
      temp: row['Temp']||'',
      time: row['Time']||'',
      warn: hasWarning(row)
    };
  });
}

// ── Batch management ──────────────────────────────────────────────────────────
function addToBatch() {
  const ac   = document.getElementById('sel-ac').value;
  const item = document.getElementById('sel-item').value;
  const size = document.getElementById('sel-size').value;
  const qty  = parseInt(document.getElementById('qty').value)||1;
  const errEl = document.getElementById('error-bar');
  errEl.style.display = 'none';

  if (!ac||!item||!size) {
    errEl.textContent = 'Please select adult/child, garment and size.';
    errEl.style.display = 'block'; return;
  }

  const rows = allRows.filter(r => r['Adult - Child']===ac && r['Item']===item && r['Size']===size);
  if (!rows.length) {
    errEl.textContent = 'No data found for this combination — check your sheet.';
    errEl.style.display = 'block'; return;
  }

  batch.push({ ac, item, size, qty, rows });
  renderBatch();
  document.getElementById('preview-section').style.display = 'none';

  // Reset selectors
  document.getElementById('sel-ac').value = '';
  document.getElementById('sel-item').innerHTML = '<option value="">Select adult/child first</option>';
  document.getElementById('sel-item').disabled = true;
  document.getElementById('sel-size').innerHTML = '<option value="">Select garment first</option>';
  document.getElementById('sel-size').disabled = true;
  document.getElementById('qty').value = 1;
}

function removeFromBatch(i) {
  batch.splice(i,1);
  renderBatch();
  document.getElementById('preview-section').style.display = 'none';
}

function clearBatch() {
  batch = [];
  renderBatch();
  document.getElementById('preview-section').style.display = 'none';
}

function renderBatch() {
  const sec = document.getElementById('batch-section');
  const list = document.getElementById('batch-list');
  if (!batch.length) { sec.style.display='none'; return; }
  sec.style.display = 'block';
  list.innerHTML = batch.map((job,i) => {
    const files = buildFileList(job.rows);
    return `<div class="batch-item">
      <div class="batch-num">×${job.qty}</div>
      <div class="batch-detail">
        <div class="batch-label">${job.ac} · ${job.item} · Size ${job.size}</div>
        <div class="batch-sub">${files.length} placement${files.length!==1?'s':''} · ${files.length} file${files.length!==1?'s':''} to import</div>
      </div>
      <div class="batch-actions">
        <button class="btn btn-danger" onclick="removeFromBatch(${i})" style="padding:5px 10px;font-size:12px">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ── Preview ───────────────────────────────────────────────────────────────────
function previewBatch() {
  if (!batch.length) return;

  // Summary table
  const allFiles = [];
  batch.forEach(job => buildFileList(job.rows).forEach(f => {
    allFiles.push({...f, qty: job.qty, item: job.item, size: job.size, ac: job.ac});
  }));

  document.getElementById('summary-table').innerHTML = `
    <table class="file-table">
      <thead><tr>
        <th>File to import into Digital Factory</th>
        <th>Location</th>
        <th>Garment</th>
        <th>Size</th>
        <th style="text-align:center">Copies</th>
        <th>Press</th>
      </tr></thead>
      <tbody>
        ${allFiles.map(f => `<tr>
          <td>${f.name}</td>
          <td>${locationBadge(f.loc)}</td>
          <td>${f.ac} ${f.item}</td>
          <td>${f.size}</td>
          <td style="text-align:center"><span class="qty-pill">×${f.qty}</span></td>
          <td style="font-size:12px;color:var(--text2)">${f.temp} / ${f.time}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  // Per-job detail panels
  document.getElementById('job-previews').innerHTML = batch.map((job,i) => {
    const files = buildFileList(job.rows);
    const anyWarn = job.rows.some(hasWarning);
    const temps = [...new Set(job.rows.map(r=>r['Temp']).filter(Boolean))];
    const times = [...new Set(job.rows.map(r=>r['Time']).filter(Boolean))];
    return `<div class="preview-job">
      <div class="preview-job-title">
        <div class="job-index">${i+1}</div>
        ${job.ac} · ${job.item} · Size ${job.size} · <span style="color:var(--accent)">×${job.qty}</span>
      </div>
      ${anyWarn ? `<div class="notice"><span class="notice-icon">⚠</span><span>Some placements have unconfirmed measurements — double-check before pressing.</span></div>` : ''}
      <div class="stats" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><div class="stat-val">${files.length}</div><div class="stat-lbl">Placements</div></div>
        <div class="stat"><div class="stat-val">${files.length}</div><div class="stat-lbl">Files to import</div></div>
        <div class="stat"><div class="stat-val" style="font-size:16px">${temps[0]||'—'} / ${times[0]||'—'}</div><div class="stat-lbl">Press temp / time</div></div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-title">Placement diagram</div>
          ${buildDiagramHTML(job.rows, job.item)}
        </div>
        <div class="card">
          <div class="card-title">Logo placements</div>
          ${buildPlacementsHTML(job.rows)}
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">Files — set each to ×${job.qty} copies in Digital Factory</div>
        <table class="file-table">
          <thead><tr><th>Filename</th><th>Location</th><th>Placement</th><th>Press</th><th style="text-align:center">DF copies</th></tr></thead>
          <tbody>
            ${files.map(f => {
              const positions = [f.pos1,f.pos2,f.pos3].filter(Boolean).join(' · ');
              return `<tr>
                <td>${f.name}${f.warn?' <span class="warn-badge">⚠ check</span>':''}</td>
                <td>${locationBadge(f.loc)}</td>
                <td style="font-size:11px;color:var(--text2);font-family:var(--mono)">${positions}</td>
                <td style="font-size:12px;color:var(--text2)">${f.temp} / ${f.time}</td>
                <td style="text-align:center"><span class="qty-pill">×${job.qty}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  document.getElementById('preview-section').style.display = 'block';
  document.getElementById('preview-section').scrollIntoView({ behavior:'smooth', block:'start' });
}

// ── Copy all filenames ────────────────────────────────────────────────────────
function copyAllFiles() {
  const lines = [];
  batch.forEach(job => {
    buildFileList(job.rows).forEach(f => lines.push(f.name));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = event.target;
    const orig = btn.innerHTML;
    btn.textContent = '✓ Copied!';
    btn.style.color = '#065f46';
    setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; }, 2000);
  });
}

// ── Placements HTML ───────────────────────────────────────────────────────────
function buildPlacementsHTML(rows) {
  return rows.map(row => {
    const logo = cleanLogo(row['Logo']||'');
    const pos1=row['Position1']||'', pos2=row['Postion2']||'', pos3=row['Position3']||'';
    const positions=[pos1,pos2,pos3].filter(Boolean).join(' · ');
    const warn=hasWarning(row);
    return `<div class="placement-row">
      <div class="logo-letter">${logoLetter(logo)}</div>
      <div class="placement-detail">
        <div class="placement-name">
          ${locationBadge(row['Location']||'')}
          <span>${logo}</span>
          ${warn?'<span class="warn-badge">⚠ check</span>':''}
        </div>
        ${positions?`<div class="placement-pos">${positions}</div>`:''}
        <div class="press-info">${row['Temp']||''} · ${row['Time']||''}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Diagram ───────────────────────────────────────────────────────────────────
function buildDiagramHTML(rows, item) {
  const locs = rows.map(r=>(r['Location']||'').toLowerCase());
  const hasFront = locs.some(l=>l.includes('front'));
  const hasBack  = locs.some(l=>l.includes('back'));
  const hasHip   = locs.some(l=>l.includes('hip')||l.includes('right leg'));
  const hasBotLeg= locs.some(l=>l.includes('bottom')||l.includes('botton'));
  const isJacket = /jacket|zip/i.test(item);
  const isHoodie = /hoodie|zoodie/i.test(item);
  if (hasFront||hasBack) return torsoSVG(rows,hasFront,hasBack,isJacket,isHoodie);
  if (hasHip||hasBotLeg) return legsSVG(rows,hasHip,hasBotLeg);
  return torsoSVG(rows,true,false,isJacket,isHoodie);
}

function torsoSVG(rows,hasFront,hasBack,isJacket,isHoodie) {
  const both=hasFront&&hasBack, W=both?480:240;
  const frontRows=rows.filter(r=>(r['Location']||'').toLowerCase().includes('front'));
  const backRows=rows.filter(r=>(r['Location']||'').toLowerCase().includes('back'));
  let content='';
  if(hasFront) content+=garmentShape(20,15,isJacket,isHoodie,'Front',frontRows);
  if(hasBack)  content+=garmentShape(both?255:20,15,isJacket,isHoodie,'Back',backRows);
  return `<svg class="garment" viewBox="0 0 ${W} 270" width="${W}" height="270" xmlns="http://www.w3.org/2000/svg">
    <defs><style>.gl{font-family:'DM Sans',sans-serif;font-size:11px;fill:#9e9890;text-anchor:middle}
    .gc{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;fill:white;text-anchor:middle}</style></defs>
    ${content}</svg>`;
}

function garmentShape(ox,oy,isJacket,isHoodie,label,rows) {
  const cx=ox+100;
  const bodyPath=`M${ox+35},${oy+38} L${ox+15},${oy+58} L${ox+15},${oy+235} L${ox+185},${oy+235} L${ox+185},${oy+58} L${ox+165},${oy+38}`;
  const lSleeve=`M${ox+35},${oy+38} L${ox+2},${oy+65} L${ox+2},${oy+145} L${ox+15},${oy+145} L${ox+15},${oy+58}`;
  const rSleeve=`M${ox+165},${oy+38} L${ox+198},${oy+65} L${ox+198},${oy+145} L${ox+185},${oy+145} L${ox+185},${oy+58}`;
  const neckPath=isHoodie
    ?`<path d="M${ox+72},${oy+12} Q${cx},${oy+48} ${ox+128},${oy+12}" fill="#d5d0c8" stroke="#b5b0a8" stroke-width="1"/>`
    :`<path d="M${ox+72},${oy+12} Q${cx},${oy+30} ${ox+128},${oy+12}" fill="#d5d0c8" stroke="#b5b0a8" stroke-width="1"/>`;
  const zipLine=isJacket?`<line x1="${cx}" y1="${oy+28}" x2="${cx}" y2="${oy+235}" stroke="#b5b0a8" stroke-width="1" stroke-dasharray="4,3"/>`:'';
  const dots=rows.map(row=>{
    const letter=logoLetter(cleanLogo(row['Logo']||''));
    let dx=cx,dy=oy+110;
    if((row['Location']||'').toLowerCase().includes('front')&&isJacket) dx=cx-28;
    return `<circle cx="${dx}" cy="${dy}" r="18" fill="#2d5a3d" opacity="0.88"/><text x="${dx}" y="${dy+5}" class="gc">${letter}</text>`;
  }).join('');
  return `<g>
    <path d="${bodyPath} Z" fill="#e2ddd6" stroke="#b5b0a8" stroke-width="1"/>
    <path d="${lSleeve} Z" fill="#d5d0c8" stroke="#b5b0a8" stroke-width="1"/>
    <path d="${rSleeve} Z" fill="#d5d0c8" stroke="#b5b0a8" stroke-width="1"/>
    ${neckPath}${zipLine}${dots}
    <text x="${cx}" y="${oy+253}" class="gl">${label}</text>
  </g>`;
}

function legsSVG(rows,hasHip,hasBottomLeg) {
  const hipRows=rows.filter(r=>{const l=(r['Location']||'').toLowerCase();return l.includes('hip')||l.includes('right leg');});
  const botRows=rows.filter(r=>{const l=(r['Location']||'').toLowerCase();return l.includes('bottom')||l.includes('botton');});
  return `<svg class="garment" viewBox="0 0 240 300" width="240" height="300" xmlns="http://www.w3.org/2000/svg">
    <defs><style>.gl{font-family:'DM Sans',sans-serif;font-size:11px;fill:#9e9890;text-anchor:middle}
    .gc{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;fill:white;text-anchor:middle}</style></defs>
    <rect x="30" y="10" width="75" height="22" rx="5" fill="#d5d0c8" stroke="#b5b0a8" stroke-width="1"/>
    <rect x="115" y="10" width="75" height="22" rx="5" fill="#d5d0c8" stroke="#b5b0a8" stroke-width="1"/>
    <path d="M30,32 L30,210 Q30,232 52,232 L83,232 Q105,232 105,210 L105,32 Z" fill="#e2ddd6" stroke="#b5b0a8" stroke-width="1"/>
    <path d="M115,32 L115,210 Q115,232 137,232 L168,232 Q190,232 190,210 L190,32 Z" fill="#e2ddd6" stroke="#b5b0a8" stroke-width="1"/>
    ${hasHip?hipRows.map(r=>`<circle cx="152" cy="75" r="18" fill="#2d5a3d" opacity="0.88"/><text x="152" y="80" class="gc">${logoLetter(cleanLogo(r['Logo']||''))}</text>`).join(''):''}
    ${hasBottomLeg?botRows.map(r=>`<circle cx="152" cy="190" r="18" fill="#4c1d95" opacity="0.88"/><text x="152" y="195" class="gc">${logoLetter(cleanLogo(r['Logo']||''))}</text>`).join(''):''}
    <text x="120" y="255" class="gl">right leg</text>
  </svg>`;
}

// ── PDF generation ────────────────────────────────────────────────────────────

  // Collect all files across batch

    </tr>`;

  const jobPages = batch.map((job, ji) => {
    const files = buildFileList(job.rows);
    const fileRows = files.map(f => {
      const positions=[f.pos1,f.pos2,f.pos3].filter(Boolean).join(' · ');
      return `<tr>
        <td style="font-family:monospace;font-size:11px;padding:7px 10px;border-bottom:1px solid #e5e7eb">${f.name}${f.warn?' ⚠':''}</td>
        <td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:center;font-weight:700;font-size:16px;color:#2d5a3d">×${job.qty}</td>

      </tr>`;
    }).join('');

    return `<div style="page-break-before:always;padding:32px 36px;font-family:'Helvetica Neue',Arial,sans-serif">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
        <div>
          <div style="font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#9ca3af;margin-bottom:4px">Job ${ji+1} of ${batch.length}</div>
          <div style="font-size:20px;font-weight:700;color:#1a1814">${job.ac} · ${job.item}</div>
          <div style="font-size:14px;color:#6b7280;margin-top:2px">Size ${job.size} · <strong style="color:#2d5a3d">×${job.qty} copies in Digital Factory</strong></div>
        </div>
        <div style="text-align:right;font-size:12px;color:#9ca3af">${today}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;margin-bottom:24px">
        <thead>
          <tr style="background:#f3f4f6">
            <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">File — import into Digital Factory</th>
            <th style="padding:8px 10px;text-align:center;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">DF copies</th>
            <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Location</th>
            <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Placement / measurement</th>
            <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Press temp / time</th>
          </tr>
        </thead>
        <tbody>${fileRows}</tbody>
      </table>
      ${job.rows.some(hasWarning)?`<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:16px">⚠ Some placements have unconfirmed measurements — double check before pressing.</div>`:''}
    </div>`;
  }).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>UPA Batch ${today}</title>
  <style>
    @media print {
      body { margin: 0; }
      .no-print { display: none !important; }
    }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; color: #1a1814; }
  </style>
  </head><body>
  <!-- Summary page -->
  <div style="padding:32px 36px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #1a1814">
      <div>

      <div style="font-size:28px;font-weight:800;color:#2d5a3d">UP</div>

    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="background:#f3f4f6">
          <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Filename</th>
          <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Garment</th>
          <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Size</th>
          <th style="padding:8px 10px;text-align:center;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Copies</th>
          <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Location</th>
          <th style="padding:8px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;font-weight:600">Placement</th>

        </tr>
      </thead>
      <tbody>${summaryRows}</tbody>
    </table>
  </div>
  ${jobPages}
  </body></html>`;

  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `UPA_Batch_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  URL.revokeObjectURL(url);
}

loadSheet();
